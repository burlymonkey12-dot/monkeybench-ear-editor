<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Bench Monkey — Shape Editor v6.2</title>
<style>
  :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; color:#fff; }
  body { display:flex; flex-direction:column; }
  #topbar {
    display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:#181818; border-bottom:1px solid #333; flex-wrap:wrap;
  }
  .brand { font-weight:800; margin-right:auto; white-space:nowrap; }
  .badge { font-size:12px; background:#26372b; border:1px solid #4b8059; padding:5px 8px; border-radius:999px; }
  button, select {
    appearance:none; border:1px solid #4a4a4a; border-radius:10px; background:#272727; color:#fff;
    min-height:40px; padding:8px 11px; font-size:14px; font-weight:650;
  }
  button:active { transform:scale(.98); background:#333; }
  button.primary { background:#f1f1f1; color:#111; border-color:#f1f1f1; }
  button.on { outline:2px solid #d000d0; }
  button:disabled { opacity:.35; }
  #editorWrap { position:relative; flex:1; min-height:0; background:#222; overflow:hidden; }
  #editor { width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  .path { fill:none; stroke:#d000d0; stroke-width:2.2; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round; }
  .ghost { fill:none; stroke:#bbb; stroke-width:1; vector-effect:non-scaling-stroke; opacity:.35; stroke-dasharray:5 5; }
  .guide { stroke:#55c7ff; stroke-width:1; vector-effect:non-scaling-stroke; opacity:.75; }
  .handle-hit { fill:transparent; stroke:transparent; pointer-events:all; }
  .handle { fill:#ffd84a; stroke:#111; stroke-width:1; vector-effect:non-scaling-stroke; }
  .anchor { fill:#35b8ff; stroke:#111; stroke-width:1.2; vector-effect:non-scaling-stroke; }
  .anchor.locked { fill:#ff8f3a; }
  .selected { stroke:#fff !important; stroke-width:2.5 !important; }
  #hud {
    position:absolute; left:10px; top:10px; pointer-events:none; background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:7px 9px; font-size:12px;
  }
  #bottom {
    background:#181818; border-top:1px solid #333; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:grid; grid-template-columns:auto auto auto auto 1fr auto; gap:7px; align-items:center;
  }
  #sel { min-width:130px; font-size:12px; line-height:1.25; color:#ddd; }
  #nudges { display:grid; grid-template-columns:40px 40px 40px; grid-template-rows:36px 36px; gap:4px; }
  #nudges button { padding:0; min-height:36px; }
  #nUp { grid-column:2; } #nLeft { grid-column:1;grid-row:2; } #nDown { grid-column:2;grid-row:2; } #nRight { grid-column:3;grid-row:2; }
  label.slider { display:flex; align-items:center; gap:7px; font-size:12px; white-space:nowrap; }
  input[type=range] { width:110px; }

  #precisionWrap { display:flex; align-items:center; gap:8px; }
  #precisionPad { width:112px; height:112px; border-radius:50%; border:1px solid #555; background:radial-gradient(circle at center,#333 0 16%,#222 17% 48%,#171717 49%); position:relative; touch-action:none; flex:0 0 auto; }
  #precisionKnob { width:30px; height:30px; border-radius:50%; background:#35b8ff; border:2px solid #fff; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; box-sizing:border-box; }
  #precisionLabel { font-size:11px; color:#bbb; max-width:105px; line-height:1.25; }
  #mobileTools { position:absolute; right:10px; bottom:10px; display:flex; gap:6px; z-index:5; }
  #mobileTools button { min-height:38px; padding:6px 9px; background:rgba(25,25,25,.9); }
  .construction-line { fill:none; stroke:#7ee787; stroke-width:2.2; vector-effect:non-scaling-stroke; pointer-events:stroke; }
  .construction-pin { stroke:#111; stroke-width:1.2; vector-effect:non-scaling-stroke; }
  .pin-label { fill:#fff; stroke:#111; stroke-width:.6; paint-order:stroke; font-size:9px; font-weight:800; pointer-events:none; }
  .curve-handle { fill:#ffd84a; stroke:#111; stroke-width:1; vector-effect:non-scaling-stroke; }
  @media (max-width:760px) {
    #topbar { gap:6px; }
    #topbar button { min-height:36px; padding:6px 9px; font-size:13px; }
    .brand { width:100%; margin:0; }
    #bottom { grid-template-columns:1fr auto auto; }
    #sel { grid-column:1 / -1; }
    #nudges { grid-column:1; }
    .slider { grid-column:2 / 4; }
  }

/* === v6.2 BIG MAT / WORKBENCH-FIRST LAYOUT === */
:root{--bm-sidebar:270px}
body.bigMatDesktop{
  display:grid;
  grid-template-columns:var(--bm-sidebar) minmax(0,1fr);
  grid-template-rows:auto 1fr;
  min-height:100vh;
  overflow:hidden;
}
body.bigMatDesktop header, body.bigMatDesktop .topbar{
  grid-column:1 / -1;
}
body.bigMatDesktop #toolPanel{
  grid-column:1;
  grid-row:2;
  align-content:start;
  overflow-y:auto;
  overflow-x:hidden;
  max-height:calc(100vh - 72px);
  padding:10px;
  border-right:1px solid #444;
}
body.bigMatDesktop #toolPanel button{
  width:100%;
  margin:4px 0;
}
body.bigMatDesktop #editorWrap{
  grid-column:2;
  grid-row:2;
  width:100% !important;
  height:calc(100vh - 72px) !important;
  max-width:none !important;
  max-height:none !important;
  margin:0 !important;
  overflow:hidden;
}
body.bigMatDesktop #editor{
  width:100% !important;
  height:100% !important;
  max-width:none !important;
  max-height:none !important;
}
body.bigMatDesktop.toolsCollapsed{
  --bm-sidebar:54px;
}
body.bigMatDesktop.toolsCollapsed #toolPanel button:not(#collapseToolsBtn),
body.bigMatDesktop.toolsCollapsed #toolPanel input,
body.bigMatDesktop.toolsCollapsed #toolPanel label{
  display:none !important;
}
body.bigMatDesktop.toolsCollapsed #collapseToolsBtn{
  display:block !important;
  min-width:40px;
  padding:10px 4px;
}
/* Phone/tablet: retain touch-friendly stacked controls. */
@media (max-width: 820px){
  body.bigMatDesktop{
    display:block;
    overflow:auto;
  }
  body.bigMatDesktop #toolPanel{
    max-height:none;
    overflow:visible;
    border-right:0;
  }
  body.bigMatDesktop #toolPanel button{
    width:auto;
  }
  body.bigMatDesktop #editorWrap{
    width:100% !important;
    height:auto !important;
  }
}

</style>
</head>
<body>
<div id="topbar">
  <div class="brand">🐵 Bench Monkey — Shape Editor <span style="opacity:.55">v5</span></div>
  <span class="badge">📌 Placement locked • pins individually lockable</span>
  <button id="fitBtn">3-foot view</button>
  <button id="earBtn">Zoom ear</button>
  <button id="refBtn" class="on">Reference</button>
  <button id="overlayViewBtn">Overlay</button>
  <button id="sideBySideBtn">Side-by-side</button>
  <button id="ghostBtn">Original curve</button>
  <button id="undoBtn">↶ Undo</button>
  <button id="redoBtn">↷ Redo</button>
  <button id="resetBtn">Reset</button>
  <button id="addPinBtn">📌 Add Pin</button>
  <button id="hidePinsBtn">👁 Hide Pins</button>
  <button id="handlesBtn">〰 Hide Handles</button>
  <button id="connectModeBtn">🧵 Connect by Click</button>
  <button id="cornerNodeBtn" disabled>◼ Corner</button>
  <button id="smoothNodeBtn" disabled>〰 Smooth</button>
  <button id="symmetricNodeBtn" disabled>↔ Symmetric</button>
  <button id="mirrorBtn" disabled>🪞 Mirror Selection</button>
  <button id="lockBtn" disabled>🔒 Lock Pin</button>
  <button id="deleteBtn" disabled>🗑 Delete Pin</button>
  <button id="loadBtn">📥 Load JSON</button>
  <input id="loadFile" type="file" accept=".json,application/json" style="display:none">
  <button id="saveBtn" class="primary">Save SVG + JSON</button>
</div>

function cloneModel() { return JSON.parse(JSON.stringify(model)); }
function pushHistory() {
  history.push(cloneModel());
  if (history.length > 100) history.shift();
  future = [];
  updateButtons();
}
function updateButtons() {
  document.getElementById('undoBtn').disabled = history.length===0;
  document.getElementById('redoBtn').disabled = future.length===0;
}

function dFrom(m) {
  let d = `M ${m.anchors[0][0].toFixed(3)} ${m.anchors[0][1].toFixed(3)}`;
  for (let i=0;i<m.segments.length;i++) {
    const s=m.segments[i], a=m.anchors[i+1];
    d += ` C ${s.c1[0].toFixed(3)} ${s.c1[1].toFixed(3)} ${s.c2[0].toFixed(3)} ${s.c2[1].toFixed(3)} ${a[0].toFixed(3)} ${a[1].toFixed(3)}`;
  }
  return d;
}

function svgPointFromClient(clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x=clientX; pt.y=clientY;
  const inv = svg.getScreenCTM().inverse();
  const p = pt.matrixTransform(inv);
  return [p.x,p.y];
}

function setView(nv) {
  const maxZoom=80;
  const minW=defaultView.w/maxZoom, minH=defaultView.h/maxZoom;
  nv.w=Math.max(minW, Math.min(defaultView.w*2, nv.w));
  nv.h=Math.max(minH, Math.min(defaultView.h*2, nv.h));
  view=nv;
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  updateHandleSizes();
}

function fitView() { setView({...defaultView}); }
function zoomEar() { setView({x:205,y:125,w:145,h:225}); }

function updateHandleSizes() {
  const rect=svg.getBoundingClientRect();
  const unitPerPx=view.w/Math.max(rect.width,1);
  const zoom=Math.max(1, defaultView.w/view.w);
  // Touch controls grow on-screen as we zoom, while geometry itself stays exact.
  const anchorPx=Math.min(18, 10 + Math.log2(zoom)*1.8);
  const handlePx=Math.min(16, 9 + Math.log2(zoom)*1.5);
  const hitPx=Math.min(40, 28 + Math.log2(zoom)*2.2);
  const rAnchor=anchorPx*unitPerPx, rHandle=handlePx*unitPerPx, rHit=hitPx*unitPerPx;
  path.style.strokeWidth=Math.min(5, 2.8 + Math.log2(zoom)*0.45);
  controls.querySelectorAll('.guide').forEach(el=>el.style.strokeWidth=Math.min(3,1.2+Math.log2(zoom)*0.35));
  controls.querySelectorAll('.anchor').forEach(el=>el.setAttribute('r',rAnchor));
  controls.querySelectorAll('.handle').forEach(el=>el.setAttribute('r',rHandle));
  controls.querySelectorAll('.handle-hit').forEach(el=>el.setAttribute('r',rHit));
}

function addCircle(x,y,cls,data) {
  const ns='http://www.w3.org/2000/svg';
  const g=document.createElementNS(ns,'g');
  const hit=document.createElementNS(ns,'circle');
  hit.setAttribute('cx',x);hit.setAttribute('cy',y);hit.setAttribute('class','handle-hit');
  hit.dataset.kind=data.kind; hit.dataset.i=data.i;
  const vis=document.createElementNS(ns,'circle');
  vis.setAttribute('cx',x);vis.setAttribute('cy',y);vis.setAttribute('class',cls);
  vis.dataset.kind=data.kind; vis.dataset.i=data.i;
  g.append(hit,vis);
  controls.appendChild(g);
  return g;
}

function addLine(a,b) {
  const ns='http://www.w3.org/2000/svg';
  const l=document.createElementNS(ns,'line');
  l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);
  l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);
  l.setAttribute('class','guide');
  controls.appendChild(l);
}

function globalPinPoint(n) {
  if (n>=1 && n<=model.anchors.length) return model.anchors[n-1];
  const fp=freePins[n-model.anchors.length-1];
  return fp ? [fp.x,fp.y] : null;
}
function renderConstruction() {
  constructionLayer.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  connections.forEach((c,ci)=>{
    const a=globalPinPoint(c.a), b=globalPinPoint(c.b); if(!a||!b)return;
    const el=document.createElementNS(ns,'path');
    const q=c.q;
    el.setAttribute('d',q?`M ${a[0]} ${a[1]} Q ${q[0]} ${q[1]} ${b[0]} ${b[1]}`:`M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}`);
    el.setAttribute('class','construction-line'); el.dataset.kind='line'; el.dataset.i=ci;
    constructionLayer.appendChild(el);
    if(selected && selected.kind==='q' && selected.i===ci){
      const qp=q||[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const h=document.createElementNS(ns,'circle'); h.setAttribute('cx',qp[0]);h.setAttribute('cy',qp[1]);h.setAttribute('r',4);h.setAttribute('class','curve-handle selected');h.dataset.kind='q';h.dataset.i=ci;constructionLayer.appendChild(h);
    }
  });
  if(!pinsVisible)return;
  freePins.forEach((p,i)=>{

function renderControls() {

    } else {
      const i=selected.i;
      if (selected.kind==='c1') addLine(model.anchors[i], model.segments[i].c1);
      else addLine(model.anchors[i+1], model.segments[i].c2);
    }
  }

  // handles first, then anchors
  if (handlesVisible && selected) {

  const lock=(k==='a' && lockedAnchors.has(i))?' • 🔒 locked':(k==='a'?' • 🔓 unlocked':(k==='p'?(freePins[i].locked?' • 🔒 locked':' • 🔓 unlocked'):''));

function updateLockButton() {

function toggleSelectedPinLock() {

function pickTarget(e) {
  const el=e.target.closest('[data-kind]');
  if (!el) return null;
  return {kind:el.dataset.kind, i:Number(el.dataset.i)};
}

function pointRef(s) {
  if (s.kind==='a') return model.anchors[s.i];
  if (s.kind==='p') return [freePins[s.i].x,freePins[s.i].y];
  if (s.kind==='q') { const c=connections[s.i],a=globalPinPoint(c.a),b=globalPinPoint(c.b); return c.q||[(a[0]+b[0])/2,(a[1]+b[1])/2]; }
  return model.segments[s.i][s.kind];
}

function moveSelectionTo(s, p, base=null) {
  if (s.kind==='a' && lockedAnchors.has(s.i)) return;
  if (s.kind==='p' && freePins[s.i].locked) return;
  if (s.kind==='a') {
    const a=model.anchors[s.i];
    const dx=p[0]-a[0], dy=p[1]-a[1];
    a[0]=p[0];a[1]=p[1];
    // Move attached handles with anchor so local tangent shape stays intact until user edits handles.
    if (s.i>0) {
      model.segments[s.i-1].c2[0]+=dx; model.segments[s.i-1].c2[1]+=dy;
    }
    if (s.i<model.segments.length) {
      model.segments[s.i].c1[0]+=dx; model.segments[s.i].c1[1]+=dy;
    }
  } else if(s.kind==='p'){ freePins[s.i].x=p[0]; freePins[s.i].y=p[1]; }
  else if(s.kind==='q'){ connections[s.i].q=[p[0],p[1]]; }
  else { const q=pointRef(s); q[0]=p[0]; q[1]=p[1]; }
}

function nudge(dx,dy) {
  if (!selected) return;
  if (selected.kind==='a' && lockedAnchors.has(selected.i)) return;
  if (selected.kind==='p' && freePins[selected.i].locked) return;
  pushHistory();
  const p=pointRef(selected);
  moveSelectionTo(selected,[p[0]+dx,p[1]+dy]);
  autosave(); render();
}

    const cx=(ps[0].x+ps[1].x)/2, cy=(ps[0].y+ps[1].y)/2;

svg.addEventListener('pointermove', e=>{
  if (!pointers.has(e.pointerId)) return;
  e.preventDefault();

    const dx=e.clientX-pinchStart.client[0], dy=e.clientY-pinchStart.client[1];

  } else if (pointers.size===2) {
    const ps=[...pointers.values()];
    const dist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);
    if (!pinchStart || pinchStart.mode!=='pinch') {
      const cx=(ps[0].x+ps[1].x)/2, cy=(ps[0].y+ps[1].y)/2;
      pinchStart={mode:'pinch',dist,center:svgPointFromClient(cx,cy),view:{...view}};

    const nv={...pinchStart.view};
    const nw=nv.w*factor, nh=nv.h*factor;
    const rx=(pinchStart.center[0]-nv.x)/nv.w;
    const ry=(pinchStart.center[1]-nv.y)/nv.h;

  const svgOut=`<svg xmlns="http://www.w3.org/2000/svg" width="352" height="591" viewBox="0 0 352 591"><path d="${d}" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  download('Bunsen_Ear_UserEdited.svg',svgOut,'image/svg+xml');
  setTimeout(()=>download('Bunsen_Ear_UserEdited.json',JSON.stringify(meta,null,2),'application/json'),300);
};


document.getElementById('loadBtn').onclick=()=>document.getElementById('loadFile').click();
document.getElementById('loadFile').onchange=async e=>{
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  try{
    const saved=JSON.parse(await file.text());
    const incoming=saved.model||saved;
    if(!Array.isArray(incoming.anchors)||!Array.isArray(incoming.segments)) throw new Error('Missing anchors/segments');
    if(incoming.segments.length!==incoming.anchors.length-1) throw new Error('Curve geometry is incomplete');
    pushHistory();
    model={anchors:structuredClone(incoming.anchors),segments:structuredClone(incoming.segments)};
    lockedAnchors=new Set(saved.locked_anchors||[]);
    freePins=structuredClone(saved.free_pins||saved.freePins||[]);
    connections=structuredClone(saved.connections||[]);
    selected=null; selectedPins.clear(); connectSequence=[];
    autosave(); render(); fitView();
    alert('JSON loaded. Ear geometry and construction data restored.');
  }catch(err){ alert('Could not load this JSON: '+err.message); }
  e.target.value='';
};


function selectedStructuralAnchorIndex(){
  if(!selected) return null;
  if(selected.kind==='a') return selected.i;
  // Existing editor handle selections identify a segment and side.
  // Map the selected handle back to the structural anchor it controls.
  if(selected.kind==='h'){
    if(Number.isInteger(selected.anchorI)) return selected.anchorI;
    if(Number.isInteger(selected.i)){
      if(selected.side==='in'||selected.which==='in') return selected.i+1;
      return selected.i;
    }
  }
  return null;
}
function updateNodeToolState(){
  const i=selectedStructuralAnchorIndex();
  const handleActive=!!(selected&&selected.kind==='h');
  const ok=(i!==null&&i>0&&i<model.anchors.length-1)||handleActive;
  ['cornerNodeBtn','smoothNodeBtn','symmetricNodeBtn'].forEach(id=>{
    const b=document.getElementById(id); if(b)b.disabled=!ok;
  });
}
function setBezierNodeMode(mode){
  const i=selectedStructuralAnchorIndex();
  if(i===null){alert('Select a purple structural anchor first.');return;}
  if(i<=0||i>=model.anchors.length-1){alert('Choose an interior purple anchor.');return;}
  const a=model.anchors[i], left=model.segments[i-1], right=model.segments[i];
  if(!left||!right||!left.q||!right.q){alert('This anchor needs curve handles on both sides.');return;}
  pushHistory();
  if(mode==='corner'){
    a.nodeMode='corner'; autosave(); render(); updateNodeToolState(); return;
  }
  const lv={x:left.q[0]-a.x,y:left.q[1]-a.y};
  const rv={x:right.q[0]-a.x,y:right.q[1]-a.y};
  const ll=Math.hypot(lv.x,lv.y)||1, rl=Math.hypot(rv.x,rv.y)||1;
  let ux=lv.x/ll-rv.x/rl, uy=lv.y/ll-rv.y/rl, ul=Math.hypot(ux,uy);
  if(ul<1e-6){ux=lv.x/ll;uy=lv.y/ll;ul=1;}
  ux/=ul;uy/=ul;
  let leftLen=ll,rightLen=rl;
  if(mode==='symmetric'){const avg=(ll+rl)/2;leftLen=avg;rightLen=avg;}
  left.q=[a.x+ux*leftLen,a.y+uy*leftLen];
  right.q=[a.x-ux*rightLen,a.y-uy*rightLen];
  a.nodeMode=mode;
  autosave();render();updateNodeToolState();
}
document.getElementById('cornerNodeBtn').onclick=()=>setBezierNodeMode('corner');
document.getElementById('smoothNodeBtn').onclick=()=>setBezierNodeMode('smooth');
document.getElementById('symmetricNodeBtn').onclick=()=>setBezierNodeMode('symmetric');


function applyBigMatLayout(){
  const desktop=window.matchMedia('(min-width: 821px)').matches;
  document.body.classList.toggle('bigMatDesktop',desktop);
  if(!desktop) document.body.classList.remove('toolsCollapsed');
}
document.getElementById('collapseToolsBtn').onclick=()=>{
  document.body.classList.toggle('toolsCollapsed');
  setTimeout(()=>{try{updateHandleSizes();render();}catch(e){}},50);
};
window.addEventListener('resize',applyBigMatLayout);
applyBigMatLayout();


let sideBySideOn=false;
function exitSideBySide(){
  const shell=document.getElementById('bmCompareShell');
  if(shell){ shell.replaceWith(document.getElementById('editorWrap')); }
  sideBySideOn=false;
  try{render();updateHandleSizes();}catch(e){}
}
document.getElementById('overlayViewBtn').onclick=()=>{
  if(sideBySideOn) exitSideBySide();
  const r=document.getElementById('reference');
  if(r) r.style.opacity='0.55';
};
document.getElementById('sideBySideBtn').onclick=()=>{
  if(sideBySideOn){exitSideBySide();return;}
  const wrap=document.getElementById('editorWrap');
  const shell=document.createElement('div'); shell.id='bmCompareShell';
  shell.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;height:100%;overflow:hidden;';
  const left=document.createElement('div'); left.style.cssText='position:relative;overflow:hidden;border-right:1px solid #555;';
  const right=document.createElement('div'); right.style.cssText='position:relative;overflow:hidden;';
  const clone=wrap.cloneNode(true); clone.id='bmReferenceWrap';
  clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  clone.style.cssText='width:100%;height:100%;pointer-events:none;';
  const cloneSvg=clone.querySelector('svg'); if(cloneSvg){cloneSvg.style.width='100%';cloneSvg.style.height='100%';}
  const badge=document.createElement('div'); badge.textContent='⭐ North Star / Reference';
  badge.style.cssText='position:absolute;z-index:5;top:8px;left:8px;background:#24112f;color:white;padding:6px 9px;border-radius:8px;';
  left.append(clone,badge);
  const editBadge=document.createElement('div'); editBadge.textContent='🔧 Edited Ear';
  editBadge.style.cssText='position:absolute;z-index:5;top:8px;left:8px;background:#10243a;color:white;padding:6px 9px;border-radius:8px;pointer-events:none;';
  wrap.replaceWith(shell); right.append(wrap,editBadge); shell.append(left,right);
  sideBySideOn=true;
  try{render();updateHandleSizes();}catch(e){}
};

window.addEventListener('resize',updateHandleSizes);
document.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();deleteSelectedPin();return;}if(e.key==='Escape'){addPinMode=false;connectClickMode=false;connectSequence=[];document.getElementById('addPinBtn').classList.remove('on');document.getElementById('connectModeBtn').classList.remove('on');document.getElementById('connectModeBtn').textContent='🧵 Connect by Click';}});
restoreAutosave();
document.getElementById('pinSize').value=pinSizePx;
render();
fitView();
updateButtons();
})();
</script>
